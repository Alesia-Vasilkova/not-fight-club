<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/fight.ico" />
    <link rel="stylesheet" href="styles.css" />
    <title>Not Fight Club</title>
    <script>
      function setItem(obj) {
        const prev = JSON.parse(localStorage.getItem("userSettings") || "{}");
        localStorage.setItem(
          "userSettings",
          JSON.stringify({ ...prev, ...obj })
        );
      }
      function getItem(key) {
        const outPut = localStorage.getItem("userSettings");
        const parseSettings = JSON.parse(outPut || "{}");
        const savedInfo = parseSettings[key];
        return savedInfo;
      }
      function hidePages() {
        const pages = document.querySelectorAll(".page");
        pages.forEach((page) => {
          page.classList.add("hide");
        });
      }
      function login() {
        const un = document.getElementById("user-name");
        const val = un.value;
        if (val === "") {
          return;
        }
        setItem({ name: val });
        hidePages();
        const nextPage = document.querySelector(".main-home");
        nextPage.classList.remove("hide");
      }
      function fight() {
        hidePages();
        const nextPage = document.querySelector("#battle-page");
        nextPage.classList.remove("hide");
        displayName();
        const showImageFromStorage =
          document.querySelectorAll(".chosen-img-char");
        showImageFromStorage.value = getItem("img");
      }
      function mainInfo() {
        hidePages();
        const nextPage = document.querySelector(".main-home");
        nextPage.classList.remove("hide");
      }
      function profileInfo() {
        hidePages();
        const nextPage = document.querySelector("#character-page");
        nextPage.classList.remove("hide");
        displayName();
      }
      function settingsInfo() {
        hidePages();
        const nextPage = document.querySelector("#settings-page");
        nextPage.classList.remove("hide");
        displayNameSettings();
      }
      function editProfileImages() {
        const showModal = document.querySelector(".modal");
        showModal.classList.remove("hide");
      }
      function closeProfileImages() {
        const closeModal = document.querySelector(".modal");
        closeModal.classList.add("hide");
      }
      function displayName() {
        const savedName = getItem("name");
        const outPutSect = document.getElementById("userName");
        outPutSect.textContent = savedName ? savedName : "Something went wrong";
      }
      function displayNameBattle() {
        const savedNameBattle = getItem("name");
        const outPutName = document.getElementById("userNameBattle");
        outPutName.textContent = savedNameBattle
          ? savedNameBattle
          : "Something went wrong";
      }
      function displayNameSettings() {
        const savedName = getItem("name");
        const outPutSect = document.getElementById("userNameSettings");
        const outPutNameInput = document.getElementById(
          "userNameSettingsInput"
        );
        outPutSect.textContent = savedName ? savedName : "Something went wrong";
        outPutNameInput.value = getItem("name");
      }
      function changeButtonEdit(edit = true) {
        const inputButtonHiden = document.querySelectorAll(".tools");
        const inputButtonNoHiden = document.querySelectorAll(".changeUserName");
        const toHide = !edit ? inputButtonHiden : inputButtonNoHiden;
        const toShow = edit ? inputButtonHiden : inputButtonNoHiden;

        toShow.forEach((tools) => {
          tools.classList.remove("hide");
        });
        toHide.forEach((changeUserName) => {
          changeUserName.classList.add("hide");
        });
      }
      function changeSaveName() {
        changeButtonEdit(false);
        const setItemName = document.getElementById("userNameSettingsInput");
        const newName = setItemName.value;
        setItem({ name: newName });
        displayName();
        displayNameSettings();
      }
      function selectImg(index) {
        const mainImgs = document.querySelectorAll(".main-img-char .img");
        document.querySelectorAll(".imgs-char .img").forEach((img, i) => {
          img.classList.remove("selected");
          if (index === i) {
            img.classList.add("selected");
            mainImgs.forEach((mI) => {
              mI.src = img.src;
            });
            setItem({ img: index });
          }
        });
      }
    </script>
  </head>
  <body>
    <section class="sign-up page" id="sign-up">
      <div class="sign-up-h">
        <h1 class="main-text">Create your character</h1>
      </div>
      <div class="char-inp">
        <label>Character name</label>
        <input type="text" id="user-name" />
      </div>
      <div class="first-button">
        <button class="sign-button" onclick="login()">Create character</button>
      </div>
    </section>
    <section class="main-home page" id="main-page">
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Main</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="fight">
        <button class="fight-btn" onclick="fight()">Fight!</button>
      </div>
    </section>
    <section class="battle page" id="battle-page">
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Battle</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="fightField">
        <div class="characterField">
          <span id="userName"> </span>
          <div class="chosen-img-char main-img-char">
            <img
              class="img"
              src="assets/characters/vecteezy_admired-and-cute-game-character-for-tshirt-print-generative-ai_27294897.png"
            />
          </div>
          <div class="viewCharacter"></div>
          <div class="healthCharacter">
            <progress
              class="HealthCharacterBar"
              value="100"
              max="100"
            ></progress>
            <p class="amountHelthCharacter">150 / 150</p>
          </div>
        </div>
        <div class="fightZone">
          <p>Please pick 1 Attack zone and 2 Defence zones</p>
          <div class="deathZone">
            <div class="attackZone">
              <p>Attack Zones</p>
              <div class="radioContainer">
                <label>Head</label>
                <input type="radio" />
              </div>
              <div class="radioContainer">
                <label>Neck</label>
                <input type="radio" />
              </div>
              <div class="radioContainer">
                <label>Body</label>
                <input type="radio" />
              </div>
              <div class="radioContainer">
                <label>Belly</label>
                <input type="radio" />
              </div>
              <div class="radioContainer">
                <label>Legs</label>
                <input type="radio" />
              </div>
            </div>
            <div class="lineBetweenZones"></div>
            <div class="defenceZone">
              <p>Defence Zones</p>
              <div class="radioContainerDefence">
                <input type="radio" />
                <label>Head</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" />
                <label>Neck</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" />
                <label>Body</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" />
                <label>Belly</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" />
                <label>Legs</label>
              </div>
            </div>
          </div>
          <button class="attackButton">Attack</button>
        </div>
        <div class="enemyField">
          <span id="enemyName">Crab</span>
          <div class="viewEnemy">
            <img src="assets/characters/enemy.png" />
          </div>
          <div class="healthEnemy">
            <progress class="HealthEnemyBar" value="100" max="100"></progress>
            <p class="amountHelthEnemy">100 / 100</p>
          </div>
        </div>
      </div>
    </section>
    <section class="profile-character page" id="character-page">
      <div class="modal hide">
        <div class="modal-content">
          <div class="imgs-char">
            <img
              src="assets/characters/vecteezy_admired-and-cute-game-character-for-tshirt-print-generative-ai_27294897.png"
              id="1"
              class="img selected"
            />
            <img
              src="assets/characters/vecteezy_adorable-video-game-character-for-t-shirt-artwork_27294891.png"
              id="2"
              class="img"
            />
            <img
              src="assets/characters/vecteezy_cute-game-character-for-t-shirt-design-generative-ai_27294914.png"
              id="3"
              class="img"
            />
            <img
              src="assets/characters/vecteezy_engaging-video-game-character-for-t-shirt-design-generative-ai_27294892.png"
              id="4"
              class="img"
            />
          </div>
          <button class="closeModalbtn" onclick="closeProfileImages()">
            <img
              src="assets/vecteezy_rejected-sign-and-symbol-clip-art_22068723.png"
            />
          </button>
        </div>
      </div>
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Character</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="img-char">
        <div class="main-img-char">
          <img
            class="img"
            src="assets/characters/vecteezy_admired-and-cute-game-character-for-tshirt-print-generative-ai_27294897.png"
          />
          <button class="modalscreen" onclick="editProfileImages()">
            <img
              src="assets/characters/vecteezy_a-flat-pen-icon-on-a-hexagonal-button-flat_59243648.png"
            />
          </button>
        </div>
        <div class="charInf">
          <span id="userName"> </span>
          <div class="userResults">
            <span id="userWins"> Wins: 0 </span>
            <span id="userLoses"> Loses: 0 </span>
          </div>
        </div>
      </div>
    </section>
    <section class="settings page" id="settings-page">
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Settings</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="cont-settings">
        <span id="PlayerName">Player name: </span>
        <span id="userNameSettings" class="changeUserName"> </span>
        <input type="text" id="userNameSettingsInput" class="tools hide" />
        <button class="changeUserName" onclick="changeButtonEdit()">
          Edit
        </button>
        <button class="tools save-button hide" onclick="changeSaveName()">
          Save
        </button>
      </div>
    </section>
    <script>
      hidePages();

      const nextPage = document.querySelector(
        getItem("name") ? "#main-page" : "#sign-up"
      );
      nextPage.classList.remove("hide");

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".imgs-char img").forEach((img, index) => {
          img.addEventListener("click", () => {
            selectImg(index);
          });
        });
        const savedImg = getItem("img") || 0;
        selectImg(savedImg);
      });
    </script>
  </body>
</html>
