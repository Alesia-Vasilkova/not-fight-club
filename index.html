<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/fight.ico" />
    <link rel="stylesheet" href="styles.css" />
    <title>Not Fight Club</title>
</head>
<body>
    <section class="sign-up">
        <div class="sign-up-h">
            <h1 class="main-text">Create your character</h1>
        </div>
        <div class="char-inp">
            <label>Character name</label>
            <input type="text">
        </div>
        <div class="first-button">
            <button
                class="sign-button"
                onclick="location.href="#main-page""";>
                Create character
            </button>
        </div>
    </section>
    <section class="main-home hide" id="main-page">
        <div class="header-container">
            <div class="header-name">
                <span class="title-pg">Main</span>
            </div>
            <div class="header-icons">
                <img src="assets/header/house-icon-png-white-32.png" alt="home" />
                <img src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png" alt="profile"/>
                <img src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"/>
            </div>
        </div>
        <div class="fight">
            <button class="fight-btn"
            onclick="location.href="#battle-page";>
            Fight!
        </button>
        </div>
    </section>
    <section class="battle hide" id="battle-page">
        <div class="header-container">
            <div class="header-name">
                <span class="title-pg">Battle</span>
            </div>
            <div class="header-icons">
                <img src="assets/header/house-icon-png-white-32.png" alt="home" />
                <img src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png" alt="profile"/>
                <img src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"/>
            </div>
        </div>
    </section>
    <section class="profile-character hide" id="character-page">
        <div class="header-container">
            <div class="header-name">
                <span class="title-pg">Character</span>
            </div>
            <div class="header-icons">
                <img src="assets/header/house-icon-png-white-32.png" alt="home" />
                <img src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png" alt="profile"/>
                <img src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"/>
            </div>
        </div>
        <div class="img-char">
            <div class="main-img-char">
                <img src="assets/characters/vecteezy_admired-and-cute-game-character-for-tshirt-print-generative-ai_27294897.png">
            </div>
            <div class="imgs-char">
                <img src="assets/characters/vecteezy_adorable-video-game-character-for-t-shirt-artwork_27294891.png">
                <img src="assets/characters/vecteezy_cute-game-character-for-t-shirt-design-generative-ai_27294914.png">
                <img src="assets/characters/vecteezy_engaging-video-game-character-for-t-shirt-design-generative-ai_27294892.png">
            </div>
        </div>
    </section>
    <section class="settings hide" id="settings-page">
        <div class="header-container">
            <div class="header-name">
                <span class="title-pg">Settings</span>
            </div>
            <div class="header-icons">
                <img src="assets/header/house-icon-png-white-32.png" alt="home" />
                <img src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png" alt="profile"/>
                <img src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"/>
            </div>
        </div>
        <div class="cont-settings">
            <label>Player name:</label>
        </div>
    </section>
</body>
</html>
