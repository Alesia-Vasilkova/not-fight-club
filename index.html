<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/fight.ico" />
    <link rel="stylesheet" href="styles.css" />
    <title>Not Fight Club</title>
    <script>
      const enemies = [
        { name: "Crab", img: "assets/characters/enemy.png", attack: 2, def: 1 },
        {
          name: "Gorilla",
          img: "assets/characters/gorilla.png",
          attack: 1,
          def: 2,
        },
      ];
      const bodyParts = {
        0: "Head",
        1: "Neck",
        2: "Body",
        3: "Belly",
        4: "Legs",
      };
      const getRandomNumber = (n) => {
        return Math.floor(Math.random() * n);
      };
      function getRandomEnemy() {
        if (enemies.length === 0) {
          return null;
        }
        const randomIndex = getRandomNumber(enemies.length);
        return randomIndex;
      }
      function getZones(count) {
        const zones = [];
        while (zones.length < count) {
          const randomNumber = getRandomNumber(4);
          if (!zones.includes(randomNumber)) {
            zones.push(randomNumber);
          }
        }
        return zones;
      }
      function attack(toAttack, enemy) {
        const defs = enemy.def;
        const zones = getZones(defs);
        const resAttack = {};
        zones.forEach((zone) => {
          resAttack[zone] = true;
        });
        if (!zones.some((zone) => bodyParts[zone.toString()] === toAttack)) {
          resAttack[toAttack] = false;
        }
        return resAttack;
      }
      function defence(toDefence, enemy) {
        const attacks = enemy.attack;
        const zones = getZones(attacks);
        const result = {};
        zones.forEach((zone) => {
          result[zone] = false;
          if (!toDefence.includes(bodyParts[zone.toString()])) {
            result[zone] = true;
          }
        });
        return result;
      }

      function makeTurn() {
        const enemID = getItem("enemyID");
        const attackRes = attack(selectedOptions.attack, enemies[enemID]);
        const successfullAttack = Object.keys(attackRes).some(
          (key) => !attackRes[key]
        );

        const defendRes = defence(selectedOptions.defence, enemies[enemID]);
        const defended = Object.keys(defendRes).filter(
          (key) => !defendRes[key]
        );
        const missed = Object.keys(defendRes).filter((key) => defendRes[key]);
        const progressEnemy = document.querySelector(".HealthEnemyBar");
        let currentValueEnemy = parseInt(progressEnemy.value);
        const progressCharacter = document.querySelector(".HealthCharacterBar");
        let currentValueCharacter = parseInt(progressCharacter.value);
        const logsTerritory = document.querySelector(".log-container");
        const savedNameCharacter = getItem("name");
        const savedNameEnemy = enemies[enemID].name;

        const logArray = [];
        if (successfullAttack) {
          logArray.push(`We successfully attacked ${selectedOptions.attack}`);
        } else {
          logArray.push(
            `We missed attacked ${selectedOptions.attack} because enemy defended ${selectedOptions.attack}`
          );
        }
        defended.forEach((zone) => {
          logArray.push(
            `Enemy attacked ${bodyParts[zone.toString()]} but we defended ${
              bodyParts[zone.toString()]
            }`
          );
        });
        missed.forEach((zone) => {
          logArray.push(
            `Enemy successfullt attacked ${bodyParts[zone.toString()]}`
          );
        });

        console.log(logArray);
        // if (successfullAttack) {
        //   progressEnemy.value = currentValueEnemy - 10;
        //   console.log(
        //     `${savedNameCharacter} attacked ${savedNameEnemy} to ${selectedOptions.attack} and deal 10 damage`
        //   );
        // } else {
        //   progressEnemy.value === currentValueEnemy;
        //   console.log(
        //     `${savedNameCharacter} attacked ${savedNameEnemy} to ${selectedOptions.attack} but ${savedNameEnemy} was able to protect his ${selectedOptions.attack}`
        //   );
        // }
        // if (missedDefence === 0) {
        //   progressCharacter === currentValueCharacter;
        //   console.log(`${savedNameEnemy} attacked ${savedNameCharacter} to `);
        // } else {
        //   progressCharacter.value = currentValueCharacter - 10 * missedDefence;
        //   console.log(`you lost ${missedDefence} times`);
        // }
      }
      function setItem(obj) {
        const prev = JSON.parse(localStorage.getItem("userSettings") || "{}");
        localStorage.setItem(
          "userSettings",
          JSON.stringify({ ...prev, ...obj })
        );
      }
      function getItem(key) {
        const outPut = localStorage.getItem("userSettings");
        const parseSettings = JSON.parse(outPut || "{}");
        const savedInfo = parseSettings[key];
        return savedInfo;
      }
      function hidePages() {
        const pages = document.querySelectorAll(".page");
        pages.forEach((page) => {
          page.classList.add("hide");
        });
      }
      function login() {
        const un = document.getElementById("user-name");
        const val = un.value;
        if (val === "") {
          return;
        }
        setItem({ name: val });
        hidePages();
        const nextPage = document.querySelector(".main-home");
        nextPage.classList.remove("hide");
      }
      function fight() {
        hidePages();
        const nextPage = document.querySelector("#battle-page");
        nextPage.classList.remove("hide");
        displayName();
        const showImageFromStorage =
          document.querySelectorAll(".chosen-img-char");
        showImageFromStorage.value = getItem("img");

        const enemyName = document.querySelector("#enemyName");
        const enemyImg = document.querySelector(".viewEnemy img");

        const enemID = getRandomEnemy();
        const enem = enemies[enemID];
        setItem({ enemyID: enemID });
        enemyName.innerHTML = enem.name;
        enemyImg.src = enem.img;
        handleRadioClickDefence();
      }
      const selectedOptions = { attack: undefined, defence: [] };
      function handleRadioClick(clickedRadio) {
        const radioButtons = document.querySelectorAll(".attackZone input");
        for (let i = 0; i < radioButtons.length; i++) {
          if (radioButtons[i].name !== clickedRadio.name) {
            radioButtons[i].checked = false;
          }
        }
        selectedOptions.attack = clickedRadio.name;
      }
      function handleRadioClickDefence() {
        const fieldWithButtons = document.querySelector(".defenceZone");
        const radioButtons = fieldWithButtons.querySelectorAll(
          'input[type="radio"]'
        );
        const maxSelections = 2;
        let selectedCount = 0;

        radioButtons.forEach((radio) => {
          radio.addEventListener("change", () => {
            if (radio.checked) {
              selectedCount++;
            } else {
              selectedCount--;
            }
            if (selectedCount > 2) {
              radio.checked = false;
              selectedCount--;
            } else if (selectedCount < 0) {
              selectedCount = 0;
            }
            if (selectedCount > 0 && !radio.checked) {
              radioButtons.forEach((otherRadio) => {
                if (otherRadio !== radio && otherRadio.checked) {
                  otherRadio.checked = false;
                  selectedCount--;
                  return;
                }
              });
            }
            if (selectedCount === 0) {
              radio.checked = false;
            }

            if (
              radio.checked &&
              !selectedOptions.defence.includes(radio.name)
            ) {
              selectedOptions.defence.push(radio.name);
            }

            if (!radio.checked) {
              selectedOptions.defence = selectedOptions.defence.filter(
                (d) => d !== radio.name
              );
            }
          });
        });
      }
      function mainInfo() {
        hidePages();
        const nextPage = document.querySelector(".main-home");
        nextPage.classList.remove("hide");
      }
      function profileInfo() {
        hidePages();
        const nextPage = document.querySelector("#character-page");
        nextPage.classList.remove("hide");
        displayName();
      }
      function settingsInfo() {
        hidePages();
        const nextPage = document.querySelector("#settings-page");
        nextPage.classList.remove("hide");
        displayNameSettings();
      }
      function editProfileImages() {
        const showModal = document.querySelector(".modal");
        showModal.classList.remove("hide");
      }
      function closeProfileImages() {
        const closeModal = document.querySelector(".modal");
        closeModal.classList.add("hide");
      }
      function displayName() {
        const savedName = getItem("name");
        const outPutSect = document.getElementById("userName");
        outPutSect.textContent = savedName ? savedName : "Something went wrong";
      }
      function displayNameBattle() {
        const savedNameBattle = getItem("name");
        const outPutName = document.getElementById("userNameBattle");
        outPutName.textContent = savedNameBattle
          ? savedNameBattle
          : "Something went wrong";
      }
      function displayNameSettings() {
        const savedName = getItem("name");
        const outPutSect = document.getElementById("userNameSettings");
        const outPutNameInput = document.getElementById(
          "userNameSettingsInput"
        );
        outPutSect.textContent = savedName ? savedName : "Something went wrong";
        outPutNameInput.value = getItem("name");
      }
      function changeButtonEdit(edit = true) {
        const inputButtonHiden = document.querySelectorAll(".tools");
        const inputButtonNoHiden = document.querySelectorAll(".changeUserName");
        const toHide = !edit ? inputButtonHiden : inputButtonNoHiden;
        const toShow = edit ? inputButtonHiden : inputButtonNoHiden;

        toShow.forEach((tools) => {
          tools.classList.remove("hide");
        });
        toHide.forEach((changeUserName) => {
          changeUserName.classList.add("hide");
        });
      }
      function changeSaveName() {
        changeButtonEdit(false);
        const setItemName = document.getElementById("userNameSettingsInput");
        const newName = setItemName.value;
        setItem({ name: newName });
        displayName();
        displayNameSettings();
      }
      function selectImg(index) {
        const mainImgs = document.querySelectorAll(".main-img-char .img");
        document.querySelectorAll(".imgs-char .img").forEach((img, i) => {
          img.classList.remove("selected");
          if (index === i) {
            img.classList.add("selected");
            mainImgs.forEach((mI) => {
              mI.src = img.src;
            });
            setItem({ img: index });
          }
        });
      }
    </script>
  </head>
  <body>
    <section class="sign-up page" id="sign-up">
      <div class="sign-up-h">
        <h1 class="main-text">Create your character</h1>
      </div>
      <div class="char-inp">
        <label>Character name</label>
        <input type="text" id="user-name" />
      </div>
      <div class="first-button">
        <button class="sign-button" onclick="login()">Create character</button>
      </div>
    </section>
    <section class="main-home page" id="main-page">
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Main</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="fight">
        <button class="fight-btn" onclick="fight()">Fight!</button>
      </div>
    </section>
    <section class="battle page" id="battle-page">
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Battle</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="fightField">
        <div class="characterField">
          <span id="userName"> </span>
          <div class="chosen-img-char main-img-char">
            <img
              class="img"
              src="assets/characters/vecteezy_admired-and-cute-game-character-for-tshirt-print-generative-ai_27294897.png"
            />
          </div>
          <div class="viewCharacter"></div>
          <div class="healthCharacter">
            <progress
              class="HealthCharacterBar"
              value="100"
              max="100"
            ></progress>
            <p class="amountHelthCharacter">150 / 150</p>
          </div>
        </div>
        <div class="fightZone">
          <p>Please pick 1 Attack zone and 2 Defence zones</p>
          <div class="deathZone">
            <div class="attackZone">
              <p>Attack Zones</p>
              <div class="radioContainer">
                <label for="HeadAttack">Head</label>
                <input
                  type="radio"
                  name="Head"
                  id="HeadAttack"
                  onclick="handleRadioClick(this)"
                />
              </div>
              <div class="radioContainer">
                <label for="NeckAttack">Neck</label>
                <input
                  type="radio"
                  name="Neck"
                  id="NeckAttack"
                  onclick="handleRadioClick(this)"
                />
              </div>
              <div class="radioContainer">
                <label for="BodyAttack">Body</label>
                <input
                  type="radio"
                  name="Body"
                  id="BodyAttack"
                  onclick="handleRadioClick(this)"
                />
              </div>
              <div class="radioContainer">
                <label for="BellyAttack">Belly</label>
                <input
                  type="radio"
                  name="Belly"
                  id="BellyAttack"
                  onclick="handleRadioClick(this)"
                />
              </div>
              <div class="radioContainer">
                <label for="LegsAttack">Legs</label>
                <input
                  type="radio"
                  name="Legs"
                  id="LegsAttack"
                  onclick="handleRadioClick(this)"
                />
              </div>
            </div>
            <div class="lineBetweenZones"></div>
            <div class="defenceZone">
              <p>Defence Zones</p>
              <div class="radioContainerDefence">
                <input type="radio" id="group2Head" name="Head" />
                <label for="group2Head">Head</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" id="group2Neck" name="Neck" />
                <label for="group2Neck">Neck</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" id="group2Body" name="Body" />
                <label for="group2Body">Body</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" id="group2Belly" name="Belly" />
                <label for="group2Belly">Belly</label>
              </div>
              <div class="radioContainerDefence">
                <input type="radio" id="group2Legs" name="Legs" />
                <label for="group2Legs">Legs</label>
              </div>
            </div>
          </div>
          <button class="attackButton" onclick="makeTurn()">Attack!</button>
        </div>
        <div class="enemyField">
          <span id="enemyName">...</span>
          <div class="viewEnemy">
            <img src="assets/characters/enemy.png" />
          </div>
          <div class="healthEnemy">
            <progress class="HealthEnemyBar" value="100" max="100"></progress>
            <p class="amountHelthEnemy">100 / 100</p>
          </div>
        </div>
      </div>
      <div class="log-container">logs</div>
    </section>
    <section class="profile-character page" id="character-page">
      <div class="modal hide">
        <div class="modal-content">
          <div class="imgs-char">
            <img
              src="assets/characters/vecteezy_admired-and-cute-game-character-for-tshirt-print-generative-ai_27294897.png"
              id="1"
              class="img selected"
            />
            <img
              src="assets/characters/vecteezy_adorable-video-game-character-for-t-shirt-artwork_27294891.png"
              id="2"
              class="img"
            />
            <img
              src="assets/characters/vecteezy_cute-game-character-for-t-shirt-design-generative-ai_27294914.png"
              id="3"
              class="img"
            />
            <img
              src="assets/characters/vecteezy_engaging-video-game-character-for-t-shirt-design-generative-ai_27294892.png"
              id="4"
              class="img"
            />
          </div>
          <button class="closeModalbtn" onclick="closeProfileImages()">
            <img
              src="assets/vecteezy_rejected-sign-and-symbol-clip-art_22068723.png"
            />
          </button>
        </div>
      </div>
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Character</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="img-char">
        <div class="main-img-char">
          <img
            class="img"
            src="assets/characters/vecteezy_admired-and-cute-game-character-for-tshirt-print-generative-ai_27294897.png"
          />
          <button class="modalscreen" onclick="editProfileImages()">
            <img
              src="assets/characters/vecteezy_a-flat-pen-icon-on-a-hexagonal-button-flat_59243648.png"
            />
          </button>
        </div>
        <div class="charInf">
          <span id="userName"> </span>
          <div class="userResults">
            <span id="userWins"> Wins: 0 </span>
            <span id="userLoses"> Loses: 0 </span>
          </div>
        </div>
      </div>
    </section>
    <section class="settings page" id="settings-page">
      <div class="header-container">
        <div class="header-name">
          <span class="title-pg">Settings</span>
        </div>
        <div class="header-icons">
          <button class="home-btn" onclick="mainInfo()">
            <img src="assets/header/house-icon-png-white-32.png" alt="home" />
          </button>
          <button class="profile-btn" onclick="profileInfo()">
            <img
              src="assets/header/vecteezy_user-profile-icon-profile-avatar-user-icon-male-icon_20911740.png"
              alt="profile"
            />
          </button>
          <button class="settings-btn" onclick="settingsInfo()">
            <img
              src="assets/header/vecteezy_illustration-of-gear-icon_47463967.png"
            />
          </button>
        </div>
      </div>
      <div class="cont-settings">
        <span id="PlayerName">Player name: </span>
        <span id="userNameSettings" class="changeUserName"> </span>
        <input type="text" id="userNameSettingsInput" class="tools hide" />
        <button class="changeUserName" onclick="changeButtonEdit()">
          Edit
        </button>
        <button class="tools save-button hide" onclick="changeSaveName()">
          Save
        </button>
      </div>
    </section>
    <script>
      hidePages();

      const nextPage = document.querySelector(
        getItem("name") ? "#main-page" : "#sign-up"
      );
      nextPage.classList.remove("hide");

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".imgs-char img").forEach((img, index) => {
          img.addEventListener("click", () => {
            selectImg(index);
          });
        });
        const savedImg = getItem("img") || 0;
        selectImg(savedImg);
      });
    </script>
  </body>
</html>
